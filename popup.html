<!DOCTYPE html>
<html>
<head>
  <title>Senior Web Navigator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Browser Buddy</h1>
    <h2>Senior Web Navigator</h2>
    <div class="controls">
      <button id="increaseText">Increase Text Size</button>
      <button id="decreaseText">Decrease Text Size</button>
      <button id="highContrast">Toggle High Contrast</button>
      <button id="simplifyPage">Simplify Page</button>
      <button id="readAloud">Read Aloud</button>
      <button id="resetButton">Reset</button>

      <label for="fontSelector" class="font-selector-label" style="margin-top: 10px;">Choose Font:</label>
      <select id="fontSelector">
        <option value="default">Default</option>
        <option value="opendyslexic">OpenDyslexic</option>
        <option value="arial">Arial</option>
        <option value="verdana">Verdana</option>
        <option value="sans-serif">Sans-serif</option>
      </select>

    </div>
    <div class="help-section">
      <p>Need help? Click the buttons above to make websites easier to read and use.</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
